<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Resolutor</title>

  <!-- Office JavaScript API -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <!-- Marked library for markdown to clean HTML conversion -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="taskpane.css?v=3.7" />
</head>
<body class="theme-light">
  <!-- Invisible Right-Edge Panic Zone -->
  <div id="panic-zone" class="panic-zone"></div>

  <!-- Stealth Toolbar: strictly 0% opacity by default, 100% on hover -->
  <div class="stealth-bar" id="stealth-bar">
    <div class="opacity-group">
      <input type="range" id="opacity-slider" min="0" max="100" value="20" class="opacity-range" />
      <span id="opacity-val" class="opacity-value">20%</span>
    </div>
    <div class="stealth-actions">
      <button class="btn-stealth" id="btn-theme" title="Modo Claro / Oscuro">☾</button>
      <button class="btn-stealth" id="btn-settings" title="Configurar clave">⚿</button>
    </div>
  </div>

  <!-- Content Container: Opacity is dynamically controlled here -->
  <div class="container" id="stealth-content">
    <div>
      <div class="section-label">Tipo de Ejercicio</div>
      <select id="exercise-type" class="mode-select">
        <option value="auto">Auto-Detectar Ejercicio</option>
        <option value="simplex">Programación Lineal (Simplex)</option>
        <option value="pert">Diagrama de Redes (PERT / CPM)</option>
        <option value="arbol">Árboles de Decisión (VE)</option>
        <option value="transporte">Transporte (Costos Mínimos)</option>
        <option value="teoria">Pregunta Teórica / Desarrollo</option>
      </select>
    </div>

    <div>
      <div class="section-label">
        <span>Consigna del Ejercicio</span>
        <button class="btn btn-secondary" id="btn-get-selection" style="padding: 3px 8px; font-size: 11px;" title="Toma el texto resaltado en Word">
          Tomar de Word
        </button>
      </div>
      <textarea id="prompt-input" class="textarea-box" placeholder="Selecciona el ejercicio en tu hoja de Word y toca 'Tomar de Word', o pega la consigna aquí..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-solve">
        Resolver Paso a Paso
      </button>
      <button class="btn btn-secondary" id="btn-clear" style="flex: 0.35;" title="Limpiar">
        Limpiar
      </button>
    </div>

    <div class="btn-row" style="margin-top: 4px;">
      <button class="btn btn-secondary" id="btn-test-drawing" style="width: 100%; font-size: 11px; padding: 5px;" title="Prueba si Word Online permite insertar un lienzo vectorial editable de 3 nodos">
        Probar Dibujo Vectorial (3 Nodos)
      </button>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="loading-box">
      <div class="spinner"></div>
      <span id="loading-text">Calculando tablas y pasos matemáticos...</span>
    </div>

    <!-- Result Area -->
    <div id="result-container" style="display: none; flex-direction: column; gap: 8px; flex: 1;">
      
      <!-- Pinned Previous Consultation Header (Sticky Accordion Header) -->
      <div id="pinned-history-banner" class="pinned-history-banner" style="display: none;">
        <button id="btn-pinned-prev" class="btn-pinned-header" title="Ir a la consulta anterior">
          <span class="pinned-icon">⤴</span>
          <span class="pinned-tag">Anterior:</span>
          <span id="pinned-prev-title" class="pinned-title">...</span>
        </button>
      </div>

      <!-- Navigation & Turn Status Bar -->
      <div class="result-header">
        <div class="history-controls">
          <button class="btn btn-secondary btn-nav-pill" id="btn-turn-prev" title="Consulta anterior">◀</button>
          <span id="turn-badge" class="turn-badge">Consulta 1 de 1</span>
          <button class="btn btn-secondary btn-nav-pill" id="btn-turn-next" title="Siguiente consulta" disabled>▶</button>
        </div>
        <div style="display: flex; gap: 4px;">
          <button class="btn btn-secondary" id="btn-copy-clipboard" style="padding: 3px 8px; font-size: 11px;">
            Copiar
          </button>
        </div>
      </div>

      <!-- User Query Snippet for Active Turn -->
      <div id="turn-user-box" class="turn-user-box">
        <span class="turn-user-tag">Consigna / Pregunta:</span>
        <div id="turn-user-text" class="turn-user-text"></div>
      </div>

      <!-- Rendered Solution View -->
      <div id="result-view" class="result-card"></div>

      <!-- Pinned Next Consultation Banner (Visible when browsing past turns) -->
      <div id="pinned-next-banner" class="pinned-history-banner pinned-next" style="display: none;">
        <button id="btn-pinned-next" class="btn-pinned-header" title="Ir a la siguiente consulta">
          <span class="pinned-tag">Siguiente:</span>
          <span id="pinned-next-title" class="pinned-title">...</span>
          <span class="pinned-icon">⤵</span>
        </button>
      </div>

      <button class="btn btn-insert" id="btn-insert-word">
        Insertar Desarrollo en Word
      </button>

      <button class="btn btn-secondary" id="btn-insert-drawing" style="display: none; padding: 7px; font-weight: bold; border: 1.5px solid #000; font-size: 11px;" title="Inserta el diagrama de red vectorial editable en tu Word">
        Insertar Diagrama de Red (Dibujo Word)
      </button>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="modal">
    <div class="modal-box">
      <h4>Configurar Gemini API Key</h4>
      <p>
        Ingresa tu clave de Google Gemini para habilitar el resolutor en tu Word Online.
      </p>
      <input type="password" id="modal-key-input" placeholder="Pega tu API Key aquí..." />
      <div class="modal-link-box">
        Obtener gratis: <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
      </div>
      <div class="btn-row" style="margin-top: 6px;">
        <button class="btn btn-secondary" id="btn-modal-cancel">Cancelar</button>
        <button class="btn btn-primary" id="btn-modal-save">Guardar</button>
      </div>
    </div>
  </div>

  <script src="taskpane.js?v=3.7"></script>
</body>
</html>
